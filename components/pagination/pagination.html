<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pagination · S4 Orion</title>
<link rel="stylesheet" href="../index.css">
<link rel="stylesheet" href="../_example/example.css">
</head>
<body>
<header class="ex-bar"><h1><a href="../">Components</a> / Pagination</h1></header>
<main class="ex-main">
  <p>Move between pages of a long list or table.</p>

  <section class="ex-sec">
    <h2>Pages</h2>
    <p>Circles; the current page is filled dark. Previous and next are icon buttons.</p>
    <div class="ex-board">
      <nav class="s4-pagination" aria-label="Pagination"><a class="s4-page" href="#" aria-label="Previous Page"><span class="s4-icon" data-icon="chevron-left"></span></a><a class="s4-page" href="#">1</a><a class="s4-page" href="#" aria-current="page">2</a><a class="s4-page" href="#">3</a><span class="s4-page-gap" aria-hidden="true">…</span><a class="s4-page" href="#">9</a><a class="s4-page" href="#" aria-label="Next Page"><span class="s4-icon" data-icon="chevron-right"></span></a></nav>
    </div>
  </section>

  <p class="ex-foot">Source: <code>components/pagination/</code></p>
</main>
<script src="../assets/icons.js"></script>
<script src="../core/core.js"></script>
<script src="../button/button.js"></script>
<script src="../icon-button/icon-button.js"></script>
<script src="../_example/example.js"></script>
</body>
</html>
